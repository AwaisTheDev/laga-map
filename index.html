<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the facilities and villas at Wilson's World."
    />
    <title>Wilson's World Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f%5B%5D=erode@400,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        // Marks the document when it runs inside an iframe, so the map fills the
        // frame the host page sized instead of imposing its own aspect ratio.
        if (window.self !== window.top) document.documentElement.classList.add("is-embedded");

        // embed.js passes the host site's typography on the URL. Applied here,
        // before first paint, so the map never flashes its own fonts first.
        var params = new URLSearchParams(location.search);
        var familyPattern = /^[\w\s"',.-]{1,200}$/;

        ["body", "heading"].forEach(function (slot) {
          var family = params.get("font-" + slot);
          if (family && familyPattern.test(family)) {
            document.documentElement.style.setProperty("--font-" + slot, family);
          }
        });

        // Family names alone only render if the faces exist here too, so the
        // loader also forwards the host's font stylesheets.
        params.getAll("font-css").slice(0, 4).forEach(function (href) {
          if (href.slice(0, 8) !== "https://") return;
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <section class="map-section" id="map-section" aria-label="Interactive resort map">
      <header class="map-heading">
        <p class="map-heading-eyebrow">The Laga Experience</p>
        <h1 class="map-heading-title">
          <span class="map-heading-accent">Explore</span> Laga
        </h1>
        <p class="map-heading-lead">
          Discover the spaces and experiences that bring Laga together.
        </p>
      </header>

      <div class="map-stage">
        <div class="map-viewport" id="map-viewport">
          <div class="map-canvas" id="map-canvas">
            <div class="map-art" id="map-art" role="img" aria-label="Illustrated aerial map of Wilson's World resort"></div>
            <div class="marker-layer" id="marker-layer"></div>
          </div>
        </div>

        <div class="map-controls" aria-label="Map controls">
          <button class="icon-button" id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button class="icon-button" id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
        </div>

        <div class="hover-label" id="hover-label" aria-hidden="true"></div>
      </div>

      <div class="place-slider" id="place-slider">
        <button class="slider-nav" id="slider-prev" type="button" aria-label="Previous locations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>
        </button>
        <div class="slider-viewport">
          <nav class="slider-track" id="slider-track" aria-label="Map locations"></nav>
        </div>
        <button class="slider-nav" id="slider-next" type="button" aria-label="Next locations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
        </button>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
